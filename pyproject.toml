[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cnb-agentic-memory"
version = "2.0.3"
description = "CNB Issue 智能体记忆系统（cnb-agentic-memory）是基于 CNB 平台构建的通用记忆工具，把 CNB 的 issue、知识库、检索能力组合成一个开箱即用的智能体记忆层。"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "cnb-agentic-memory Contributors" }]
keywords = [
    "mcp",
    "memory",
    "agent",
    "cnb",
    "knowledge-base",
    "llm",
    "skill",
    "cli",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # pydantic 在 __init__ -> api -> models 主导入链上被无条件使用，必须作为基础依赖
    # 1.0.0 漏声明导致裸装（如 uvx 只装基础依赖）时 ImportError，v2 API（ConfigDict）下界为 2，v3 有破坏性风险
    "pydantic>=2,<3",
    # httpx 0.x 有破坏性变更先例（0.28 移除 proxies 等），上界对齐 typer/mcp 的处理方式
    "httpx>=0.27,<1",
    # typer 0.x 有破坏性变更先例，上界对齐 mcp 的处理方式
    "typer>=0.27.2,<1",
]

[project.optional-dependencies]
# MCP server（v2 实测迁移仅导入更名 FastMCP→MCPServer，upper bound 防 v3 破坏性变更）
mcp = ["mcp>=2.1.1,<3"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "mcp>=2.1.1,<3",
]

[project.scripts]
cnb-agentic-memory = "cnb_agentic_memory.cli:main"
cnb-agentic-memory-mcp = "cnb_agentic_memory.mcp_main:main"

[project.urls]
Homepage = "https://cnb.cool/xqitw/cnb-agentic-memory"
Repository = "https://cnb.cool/xqitw/cnb-agentic-memory"
Issues = "https://cnb.cool/xqitw/cnb-agentic-memory/-/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cnb_agentic_memory"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "docs",
    "skills",
    "README.md",
    "LICENSE",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=cnb_agentic_memory --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# typer 官方模式即 Option() 作为参数默认值，B008 在 CLI 模块中不适用
"src/cnb_agentic_memory/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
packages = ["cnb_agentic_memory"]
mypy_path = "src"
ignore_missing_imports = true
