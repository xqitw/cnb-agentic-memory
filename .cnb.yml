# CI:测试 + 类型检查 + 发布到公网 PyPI + code-wiki + git release + 同步 GitHub 镜像 + 发布 Skill + web 触发 EdgeOne Pages 部署
# 结构对齐 xqitw/journapi:
#   - main 分支 PR:跑测试(ruff + mypy + pytest + markdownlint)
#   - 打 tag (v*):测试 -> 构建发布 PyPI -> code-wiki -> git release -> 同步 GitHub -> 发布 Skill
#   - web 触发器:web 页面手动触发部署到 EdgeOne Pages($ 兜底分支,对齐 xqitw/portfolio)
# 额外挂载:记忆仓库的 issue 事件触发知识库同步(见 $ 分支)
#
# 引入 xqitw/pipes 模板聚合文件,提供 .code-wiki-pipeline / .release-pipeline
include:
  - https://cnb.cool/xqitw/pipes/-/blob/main/tpl/include.yml

# 复用片段:测试步骤
.test-stages: &test-stages
  - name: 同步依赖
    script: uv sync --extra dev
  - name: ruff lint
    script: uv run ruff check .
  - name: ruff format check
    script: uv run ruff format --check .
  - name: mypy
    script: uv run mypy src tests
  - name: pytest
    script: uv run pytest -v
  - name: markdownlint
    script: npx --yes markdownlint-cli2 '**/*.md'

# 复用片段:多版本 Python 测试（3.10-3.14，与 classifiers 声明一致；3.10 为 EO
# Python 运行时为平台硬编码版本，部署兼容要求）
# dev-base 内置 uv，用 UV_PYTHON 环境变量指定版本（uv 会按需自动下载对应 Python）
.python-env-base: &python-env-base
  docker:
    image: docker.cnb.cool/xqitw/docker/dev-base:latest
  runner:
    cpus: 2
  env:
    UV_CACHE_DIR: /root/.cache/uv

.python-310: &python-310
  <<: *python-env-base
  env:
    UV_CACHE_DIR: /root/.cache/uv
    UV_PYTHON: "3.10"
  stages: *test-stages

.python-311: &python-311
  <<: *python-env-base
  env:
    UV_CACHE_DIR: /root/.cache/uv
    UV_PYTHON: "3.11"
  stages: *test-stages

.python-312: &python-312
  <<: *python-env-base
  env:
    UV_CACHE_DIR: /root/.cache/uv
    UV_PYTHON: "3.12"
  stages: *test-stages

.python-313: &python-313
  <<: *python-env-base
  env:
    UV_CACHE_DIR: /root/.cache/uv
    UV_PYTHON: "3.13"
  stages: *test-stages

.python-314: &python-314
  <<: *python-env-base
  env:
    UV_CACHE_DIR: /root/.cache/uv
    UV_PYTHON: "3.14"
  stages: *test-stages

# 复用片段:同步代码至 GitHub 镜像仓库
# 密钥来自 xqitw/api-key 的 env-github.yml(GIT_USERNAME / GIT_ACCESS_TOKEN),不落库
.pipeline: &git-sync-pipeline
  services:
    - docker
  imports:
    - https://cnb.cool/xqitw/api-key/-/blob/main/env-github.yml
  stages:
    - name: 同步代码至GitHub
      image: tencentcom/git-sync
      settings:
        target_url: https://github.com/xqitw/cnb-agentic-memory.git
        auth_type: https
        username: ${GIT_USERNAME}
        password: ${GIT_ACCESS_TOKEN}
        force: false
        push_tags: true

# 复用片段:发布到公网 PyPI
# 密钥来自 xqitw/api-key 的 env-pypi.yml(PYPI_API_KEY,pypi- 开头 token)
.pypi-publish: &pypi-publish
  docker:
    image: ghcr.io/astral-sh/uv:python3.12-trixie
  runner:
    cpus: 2
  env:
    UV_CACHE_DIR: /root/.cache/uv
  imports:
    - https://cnb.cool/xqitw/api-key/-/blob/main/env-pypi.yml
  stages:
    - name: 构建 sdist + wheel
      script: uv build
    - name: 发布到公网 PyPI
      env:
        UV_PUBLISH_TOKEN: $PYPI_API_KEY
      script: uv publish

# 复用片段:发布 Skill 到 skillhub.cn
# 密钥来自 xqitw/api-key 的 env-skillhub-cn.yml(SKILL_HUB_CN_API_KEY,skh_ 开头)
# 版本一致性:tag 名必须与 pyproject.toml / SKILL.md 的 version 一致,防止漂移
.skillhub-publish: &skillhub-publish
  docker:
    image: docker.cnb.cool/xqitw/docker/dev-base:latest
  runner:
    cpus: 2
  imports:
    - https://cnb.cool/xqitw/api-key/-/blob/main/env-skillhub-cn.yml
  stages:
    - name: 安装 SkillHub CLI
      script: curl -fsSL https://skillhub.cn/install/install.sh | bash -s -- --cli-only
    - name: 校验版本一致性(tag = pyproject = SKILL.md)
      script: |
        TAG_VERSION="${CNB_BRANCH#v}"
        PYPROJECT_VERSION="$(grep -m1 '^version = ' pyproject.toml | cut -d '"' -f2)"
        SKILL_VERSION="$(grep -m1 '^version:' skills/cnb-agentic-memory/SKILL.md | sed 's/version:[[:space:]]*//')"
        echo "tag=$TAG_VERSION pyproject=$PYPROJECT_VERSION skill=$SKILL_VERSION"
        [ -n "$TAG_VERSION" ] && [ "$TAG_VERSION" = "$PYPROJECT_VERSION" ] \
          || { echo "pyproject.toml version 与 tag 不一致,请先同步"; exit 1; }
        [ "$TAG_VERSION" = "$SKILL_VERSION" ] \
          || { echo "skills/cnb-agentic-memory/SKILL.md version 与 tag 不一致,请先同步"; exit 1; }
    - name: 发布预检(dry-run)
      script: |
        export PATH="$HOME/.local/bin:$PATH"
        skillhub publish skills/cnb-agentic-memory --dry-run
    - name: 发布到 skillhub.cn
      script: |
        export PATH="$HOME/.local/bin:$PATH"
        skillhub publish skills/cnb-agentic-memory \
          --token "$SKILL_HUB_CN_API_KEY" \
          --changelog "$CNB_TAG_MESSAGE"

# 复用片段:web 触发部署到腾讯云 EdgeOne Pages(结构对齐 xqitw/portfolio 的部署流水线)
# 密钥来自 xqitw/api-key 的 env-eo.yml(EDGE_ONE_PAGES_API_KEY),不落库;
# 按钮声明见 .cnb/web_trigger.yml
# DEPLOY_NAME/DEPLOY_ENV 不在此硬编码(与按钮 inputs 同名双写,
# 覆盖优先级官方未明载,选「预览环境」可能被静默覆盖为生产)——以按钮 inputs 为
# 唯一来源,其 default 已兜底项目名与生产环境
.edgeone-deploy: &edgeone-deploy
  services:
    - docker
  imports:
    - https://cnb.cool/xqitw/api-key/-/blob/main/env-eo.yml
  stages:
    - name: 部署到腾讯云 EdgeOne Pages
      image: node:24
      script: |
        # 只保留 EO 需要的目录与配置,其余(src/tests/docs 等)全部删除
        find /workspace -mindepth 1 -maxdepth 1 \
          ! -name cloud-functions ! -name edgeone.json -exec rm -rf {} +
        npx edgeone pages deploy /workspace -n ${DEPLOY_NAME} -t ${EDGE_ONE_PAGES_API_KEY} -e ${DEPLOY_ENV}

main:
  pull_request:
    - <<: *python-310
    - <<: *python-311
    - <<: *python-312
    - <<: *python-313
    - <<: *python-314
  # 推送到 main:同步代码至 GitHub 镜像仓库
  push:
    - *git-sync-pipeline

$:
  # 云原生开发环境
  vscode:
    - docker:
        image: docker.cnb.cool/xqitw/docker/dev-base:latest
      runner:
        cpus: 8
      services:
        - name: vscode
          options:
            onlyPreview: true
            launch: dsh-web-launch
            keepAliveTimeout: 12h
            daemon: true
        - docker
      stages:
        - name: vscode go
          type: vscode:go
  # web 触发器:web 页面手动触发部署到 EdgeOne Pages($ 兜底分支,官方 Schema 建议)
  web_trigger_deploy:
    - *edgeone-deploy
  # 打 tag (v*):测试 + 发 PyPI + code-wiki + git release + 同步至 GitHub + 发布 Skill
  tag_push:
    - <<: *pypi-publish
    - !reference [.code-wiki-pipeline]
    - !reference [.release-pipeline]
    - *git-sync-pipeline
    - *skillhub-publish
