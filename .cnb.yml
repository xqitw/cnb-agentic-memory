# CI:测试 + 类型检查 + 发布到公网 PyPI + code-wiki + git release + 同步 GitHub 镜像
# 结构对齐 xqitw/journapi:
#   - main 分支 PR:跑测试(ruff + mypy + pytest + markdownlint)
#   - 打 tag (v*):测试 -> 构建发布 PyPI -> code-wiki -> git release
# 额外挂载:记忆仓库的 issue 事件触发知识库同步(见 $ 分支)
#
# 引入 xqitw/pipes 模板聚合文件,提供 .code-wiki-pipeline / .release-pipeline
include:
  - https://cnb.cool/xqitw/pipes/-/blob/main/tpl/include.yml

# 复用片段:测试环境
.test-base: &test-base
  docker:
    image: docker.cnb.cool/xqitw/docker/dev-base:latest
  runner:
    cpus: 2
  env:
    UV_CACHE_DIR: /root/.cache/uv

# 复用片段:测试步骤
.test-stages: &test-stages
  - name: 同步依赖
    script: uv sync --extra dev
  - name: ruff lint
    script: uv run ruff check .
  - name: ruff format check
    script: uv run ruff format --check .
  - name: mypy
    script: uv run mypy src tests
  - name: pytest
    script: uv run pytest -v
  - name: markdownlint
    script: npx --yes markdownlint-cli2 '**/*.md'

# 复用片段:多版本 Python 测试（3.11 / 3.12 / 3.13，与 classifiers 声明一致）
# dev-base 内置 uv，用 --python 指定版本；首次运行 uv 会自动下载对应版本
.python-311: &python-311
  docker:
    image: docker.cnb.cool/xqitw/docker/dev-base:latest
  runner:
    cpus: 2
  env:
    UV_CACHE_DIR: /root/.cache/uv
    UV_PYTHON: 3.11
  stages: *test-stages

.python-312: &python-312
  docker:
    image: docker.cnb.cool/xqitw/docker/dev-base:latest
  runner:
    cpus: 2
  env:
    UV_CACHE_DIR: /root/.cache/uv
    UV_PYTHON: 3.12
  stages: *test-stages

.python-313: &python-313
  docker:
    image: docker.cnb.cool/xqitw/docker/dev-base:latest
  runner:
    cpus: 2
  env:
    UV_CACHE_DIR: /root/.cache/uv
    UV_PYTHON: 3.13
  stages: *test-stages

# 复用片段:同步代码至 GitHub 镜像仓库
# 密钥来自 xqitw/api-key 的 env-github.yml(GIT_USERNAME / GIT_ACCESS_TOKEN),不落库
.pipeline: &git-sync-pipeline
  services:
    - docker
  imports:
    - https://cnb.cool/xqitw/api-key/-/blob/main/env-github.yml
  stages:
    - name: 同步代码至GitHub
      image: tencentcom/git-sync
      settings:
        target_url: https://github.com/xqitw/cnb-agentic-memory.git
        auth_type: https
        username: ${GIT_USERNAME}
        password: ${GIT_ACCESS_TOKEN}
        force: false
        push_tags: true

# 复用片段:发布到公网 PyPI
# 密钥来自 xqitw/api-key 的 env-pypi.yml(PYPI_API_KEY,pypi- 开头 token)
.pypi-publish: &pypi-publish
  docker:
    image: ghcr.io/astral-sh/uv:python3.12-trixie
  runner:
    cpus: 2
  env:
    UV_CACHE_DIR: /root/.cache/uv
  imports:
    - https://cnb.cool/xqitw/api-key/-/blob/main/env-pypi.yml
  stages:
    - name: 构建 sdist + wheel
      script: uv build
    - name: 发布到公网 PyPI
      env:
        UV_PUBLISH_TOKEN: $PYPI_API_KEY
      script: uv publish

main:
  pull_request:
    - <<: *python-311
    - <<: *python-312
    - <<: *python-313
  # 推送到 main:同步代码至 GitHub 镜像仓库
  push:
    - *git-sync-pipeline

$:
  # 云原生开发环境
  vscode:
    - docker:
        image: docker.cnb.cool/xqitw/docker/dev-base:latest
      runner:
        cpus: 8
      services:
        - name: vscode
          options:
            onlyPreview: true
            launch: dsh-web-launch
            keepAliveTimeout: 12h
            daemon: true
        - docker
      stages:
        - name: vscode go
          type: vscode:go
  # 打 tag (v*):测试 + 发 PyPI + code-wiki + git release + 同步至 GitHub
  tag_push:
    - <<: *pypi-publish
    - !reference [.code-wiki-pipeline]
    - *git-sync-pipeline
